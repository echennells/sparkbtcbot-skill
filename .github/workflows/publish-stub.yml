name: Publish stub

# Publishes stub/sparkbtcbot — the `sparkbtcbot` name-reservation package —
# with Sigstore provenance, via npm trusted publishing (OIDC). Same no-token
# posture as publish.yml: npmjs.com is configured (package settings -> Trusted
# Publisher) to accept publishes of `sparkbtcbot` ONLY from this workflow file
# in this repo, and the id-token permission is what proves that identity.
#
# Deliberately NOT triggered by v* tags, unlike publish.yml. The stub is a
# separate package from sparkbtcbot-skill and its version changes approximately
# never — wiring it to release tags would mean every skill release tried to
# republish a version that already exists, failing with a 403 and taking the
# real release down with it. Run this by hand, after bumping the stub's version,
# on the rare occasion the stub itself changes.
#
# The stub's first version (0.1.0) was necessarily published by hand: npm cannot
# authorize an OIDC publisher for a package that does not yet exist
# (https://github.com/npm/cli/issues/8544). Every publish after that goes here.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: trusted-publishing auth + provenance signing

jobs:
  publish-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a current npm (the runner's bundled one is too
      # old to speak OIDC to the registry).
      - name: Update npm
        run: npm install -g npm@latest

      # npm spends name@version permanently, so a repeat publish is a hard 403.
      # Fail here with a message that says what to do instead of in the publish.
      - name: Refuse if this version is already published
        run: |
          NAME="$(node -p "require('./stub/sparkbtcbot/package.json').name")"
          VERSION="$(node -p "require('./stub/sparkbtcbot/package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on the registry." >&2
            echo "Bump the version in stub/sparkbtcbot/package.json first." >&2
            exit 1
          fi
          echo "$NAME@$VERSION is unpublished — proceeding."

      # The stub has no dependencies and no build step: what is in the directory
      # is what ships (its package.json `files` allowlists cli.js + README.md).
      - name: Publish stub (with provenance)
        run: npm publish ./stub/sparkbtcbot --provenance --access public
